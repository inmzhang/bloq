[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
# PyPI's `bloq` name is taken; the import and CLI remain `bloq`.
name = "bloq-py"
# Version comes from `[workspace.package]` in the root Cargo.toml (via
# bloq_py/Cargo.toml), so release-plz bumps Rust and Python in one place.
dynamic = ["version"]
description = "CLI and Python bindings for the bloq fault-tolerant quantum circuit compiler"
readme = "README.md"
# Keep this package-local copy in sync with the workspace LICENSE.
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
authors = [{ name = "Yiming Zhang", email = "zhangyiming21@mail.ustc.edu.cn" }]
requires-python = ">=3.10"
dependencies = ["stim>=1.15,<2"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
bloq = "bloq._cli:main"

[project.urls]
Repository = "https://github.com/inmzhang/bloq"
Homepage = "https://bloqec.com/"
Documentation = "https://bloqec.com/docs/"

# Locked in uv.lock (checked in); `uv sync --project bloq_py --group <name>`.
[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest",
    "ruff>=0.16.10",
]
docs = ["sphinx>=9,<10", "sphinx-immaterial", "myst-parser"]

[tool.ruff]
target-version = "py310"
# Native stubs are generated by `just py-stub`.
extend-exclude = ["**/_core/*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["$MYPY_CONFIG_FILE_DIR/python/bloq"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Stim's extension does not ship type information.
module = "stim"
ignore_missing_imports = true

# Rebuild for workspace manifests, Rust sources, and embedded gallery assets.
# Custom keys replace uv's defaults; keep build inputs outside the Python crate.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*" },
  { file = "python/**/*.py" },
  { file = "../Cargo.lock" },
  { file = "../Cargo.toml" },
  { file = "../rust-toolchain.toml" },
  { file = "../bloq_*/Cargo.toml" },
  { file = "../bloq_*/src/**/*" },
  { file = "../bloq_graph/assets/**/*" },
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.maturin]
# The Rust extension is installed as `bloq._core`; the pure-Python facade in
# `python/bloq/` re-exports it. `pyo3/extension-module` is enabled here (not
# in Cargo.toml) so plain `cargo build`/`cargo run --bin stub_gen` still link
# against libpython.
module-name = "bloq._core"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
strip = true

[tool.maturin.sbom]
# Maturin's Rust SBOM embeds absolute workspace paths in component identifiers.
# Cargo.lock and THIRD-PARTY-NOTICES.txt retain dependency versions and licenses.
rust = false
