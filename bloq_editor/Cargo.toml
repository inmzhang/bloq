[package]
name = "bloq_editor"
version.workspace = true
description = "A Bevy/egui visual editor for block graphs."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "bevy_picking",
    "bevy_log",
    "png",
] }
bevy_egui = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    "manage_clipboard",
    "picking",
    "render",
] }
bevy_rich_text3d.workspace = true
egui_extras.workspace = true
bloq_circuit.workspace = true
bloq_compile.workspace = true
bloq_graph = { workspace = true, features = ["gltf", "verify"] }
bloq_ir.workspace = true
bloq_stim.workspace = true
color-eyre.workspace = true
glam = { workspace = true, features = ["serde"] }
rand.workspace = true
quizx.workspace = true
rfd.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
strum.workspace = true
syntect.workspace = true
thiserror.workspace = true
web-time.workspace = true

# Without this, native TaskPool::spawn runs CPU jobs on the calling UI thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
hotpath.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = [
    "x11",
    "wayland",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
# Enables bloq_graph's rand-based helpers when compiling the web editor to wasm.
getrandom = { workspace = true, features = ["wasm_js"] }
# QuiZX's rand 0.8 still needs the getrandom 0.2 web backend enabled separately.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlElement",
    "Node",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "MessageEvent",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[package.metadata.cargo-machete]
# winresource is used by build.rs for the Windows executable icon.
ignored = ["getrandom", "getrandom_02", "winresource"]

[build-dependencies]
winresource.workspace = true

[features]
# Hotpath's native-only dependency keeps web builds uninstrumented, including
# --all-features. Desktop timing and allocation profiling remain available.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[lints]
workspace = true
