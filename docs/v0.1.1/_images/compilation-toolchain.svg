        <rect x="360" y="108" width="40" height="16" fill="#f5f5f5"/>
        <text class="arrow-label" x="380" y="119">PYZX</text>
        <line x1="536" y1="132" x2="592" y2="132" stroke="#4f5d75" marker-end="url(#compilation-toolchain-arrow)"/>
        <rect x="540" y="108" width="48" height="16" fill="#f5f5f5"/>
