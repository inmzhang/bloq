<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1128 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compilation-toolchain-title compilation-toolchain-desc" id="compilation-toolchain-root">
        <title id="compilation-toolchain-title">Surface code compilation toolchain</title>
        <desc id="compilation-toolchain-desc">A quantum algorithm becomes a circuit, a ZX diagram, and a block graph. Bloq compiles the block graph into a physical program. Downstream tools adapt the program to hardware or simulator targets.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #compilation-toolchain-root { color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
      #compilation-toolchain-root .diagram-container { width: 100%; overflow-x: auto; }
      #compilation-toolchain-root .node-name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      #compilation-toolchain-root .sublabel { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
      #compilation-toolchain-root .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.06em; }
      #compilation-toolchain-root .diagram-container { overflow-x: visible; }</style>
          <marker id="compilation-toolchain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/></marker>
          <marker id="compilation-toolchain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/></marker>
        </defs>
        <rect width="1128" height="262" fill="#f5f5f5"/>
        <text x="564" y="33" text-anchor="middle" font-size="20" font-weight="500" fill="#2d3142">An Example End-to-End Compilation Pipeline for Surface Code Quantum Computing</text>
        <g transform="translate(0 26)">
        <rect x="572" y="44" width="352" height="152" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
