        <line x1="168" y1="132" x2="224" y2="132" stroke="#4f5d75" marker-end="url(#compilation-toolchain-arrow)"/>
        <rect x="172" y="108" width="48" height="16" fill="#f5f5f5"/>
        <text class="arrow-label" x="196" y="119">QUALTRAN</text>
