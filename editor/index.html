<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloq Editor</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root {
        --web-bg-color: #e2e8ec;
        --web-color: #1f2937;
      }

      * {
        margin: 0;
        padding: 0;
        border: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background-color: var(--web-bg-color);
        color: var(--web-color);
        font: 400 15px/1.6 system-ui, sans-serif;
      }

      .center {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .site-links {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 5px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: rgba(248, 250, 252, 0.94);
        font-size: 12px;
      }

      .site-links a { color: #1d4ed8; }
      .site-links :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 3px; }
      @media (max-width: 480px) {
        .site-links { top: auto; bottom: 8px; right: 8px; gap: 8px; }
      }

      canvas {
        outline: none;
        width: 100% !important;
        height: 100% !important;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #cbd5e1;
        border-top-color: #1d4ed8;
        border-radius: 50%;
        box-sizing: border-box;
        animation: spin 1.5s linear infinite;
      }

      .status-title {
        margin-top: 24px;
        font: 600 24px/1.3 system-ui, sans-serif;
      }

      .status-detail {
        max-width: 42rem;
        margin-top: 12px;
        padding: 0 24px;
        text-align: center;
        color: #526070;
        font: 400 15px/1.6 system-ui, sans-serif;
      }

      .error-card {
        max-width: 44rem;
        margin: 24px;
        padding: 28px 32px;
        border: 1px solid rgba(100, 116, 139, 0.85);
        border-radius: 8px;
        background: rgba(248, 250, 252, 0.96);
        box-shadow: 0 18px 48px rgba(31, 41, 55, 0.18);
        text-align: center;
        overflow-wrap: anywhere;
      }

      .error-card h1 {
        margin-bottom: 12px;
        font: 600 24px/1.3 system-ui, sans-serif;
      }

      .error-card p {
        color: #526070;
        font: 400 15px/1.6 system-ui, sans-serif;
      }

      .error-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }

      .error-actions button, .error-actions a {
        padding: 10px 16px;
        border: 1px solid #94a3b2;
        border-radius: 6px;
        font: inherit;
        color: #1d4ed8;
        background: #ffffff;
        cursor: pointer;
      }

      .error-actions :focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body class="center">
    <nav class="site-links" aria-label="Bloq website">
      <a href="../">Home</a>
      <span id="editor-version">Current editor · source build</span>
    </nav>
    <noscript>JavaScript support is required to run this app</noscript>
    <div id="loading-screen" class="center" role="status" aria-live="polite">
      <span id="loading-spinner" class="spinner" aria-hidden="true"></span>
      <p id="status-title" class="status-title">Loading editor...</p>
      <p id="status-detail" class="status-detail">
        Checking WebGPU support.
      </p>
    </div>

    <script type="module">
      const loadingScreen = document.getElementById("loading-screen");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");

      fetch("./version.json").then((response) => {
        if (!response.ok) throw new Error("Version metadata unavailable");
        return response.json();
      }).then((version) => {
        const source = version.source.slice(0, 7);
        document.getElementById("editor-version").textContent =
          `Current editor ${version.package_version} · ${source}`;
      }).catch(() => {});

      let startupComplete = false;

      function loadingScreenVisible() {
        return loadingScreen.style.display !== "none";
      }

      function setStatus(title, detail) {
        statusTitle.textContent = title;
        statusDetail.textContent = detail;
      }

      function extractErrorMessage(error) {
        if (typeof error === "string") {
          return error;
        }

        if (error && typeof error.message === "string") {
          return error.message;
        }

        return String(error);
      }

      function normalizeStartupError(error) {
        const message = extractErrorMessage(error);
        if (
          message.includes("Unable to find a GPU") ||
          message.includes("No available adapters") ||
          message.includes("RuntimeError: unreachable")
        ) {
          return "Bloq Editor could not access a compatible WebGPU adapter. Try another browser or device, update graphics drivers, use a secure HTTPS context, or disable GPU-blocking privacy settings.";
        }

        return message;
      }

      function showLoadError(title, detail) {
        startupComplete = true;
        loadingScreen.replaceChildren();
        const card = document.createElement("div");
        card.className = "error-card";
        const heading = document.createElement("h1");
        heading.textContent = title;
        const message = document.createElement("p");
        message.textContent = detail;
        const actions = document.createElement("div");
        actions.className = "error-actions";
        const retry = document.createElement("button");
        retry.textContent = "Try again";
        retry.addEventListener("click", () => window.location.reload());
        const guide = document.createElement("a");
        guide.textContent = "Desktop setup guide";
        guide.href = "../docs/dev/getting-started/installation.html#desktop-editor";
        actions.append(retry, guide);
        card.append(heading, message, actions);
        loadingScreen.append(card);
      }

      function showStartupError(error) {
        if (startupComplete || !loadingScreenVisible()) {
          return;
        }

        showLoadError("Editor failed to start.", normalizeStartupError(error));
      }

      function suppressCanvasMouseDefaults(canvas) {
        // Preserve browser keyboard shortcuts like copy/paste while reserving
        // right-click drag for editor camera panning on the canvas.
        canvas.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
        // Middle-button orbit must not trigger selection paste (Linux) or autoscroll.
        for (const type of ["mousedown", "mouseup", "auxclick"]) {
          canvas.addEventListener(type, (event) => {
            if (event.button === 1) event.preventDefault();
          });
        }
      }

      async function supportsWebGpu() {
        if (!("gpu" in navigator)) {
          return false;
        }

        try {
          const adapter = await navigator.gpu.requestAdapter();
          return adapter !== null;
        } catch {
          return false;
        }
      }

      window.addEventListener("error", (event) => {
        showStartupError(event.error ?? event.message);
      });

      window.addEventListener("unhandledrejection", (event) => {
        showStartupError(event.reason);
      });

      const observer = new MutationObserver((records) => {
        for (const record of records) {
          for (const addedNode of record.addedNodes) {
            if (addedNode instanceof HTMLCanvasElement) {
              if (addedNode.innerText.trim().length === 0) {
                addedNode.innerText =
                  "Canvas support is required to run this app";
              }

              addedNode.setAttribute("aria-label", "Bloq graph editor");
              suppressCanvasMouseDefaults(addedNode);
              startupComplete = true;
              loadingScreen.style.display = "none";
              observer.disconnect();
              return;
            }
          }
        }
      });

      observer.observe(document.body, {
        subtree: false,
        childList: true,
        attributes: false,
        characterData: false,
      });

      async function start() {
        if (!(await supportsWebGpu())) {
          showLoadError(
            "WebGPU is unavailable.",
            "Bloq Editor needs WebGPU to run in the browser. Try a WebGPU-capable browser or device with hardware acceleration enabled, use HTTPS, or update graphics drivers."
          );
          return;
        }

        setStatus(
          "Loading editor...",
          "Starting Bevy with the WebGPU renderer."
        );

        const { default: init } = await import("./build/bloq_editor.js");
        await init().catch((error) => {
          const message = extractErrorMessage(error);
          if (
            !message.startsWith(
              "Using exceptions for control flow, don't mind me. This isn't actually an error!"
            )
          ) {
            throw error;
          }
        });
      }

      start().catch((error) => {
        showStartupError(error);
        throw error;
      });
    </script>
  </body>
</html>
