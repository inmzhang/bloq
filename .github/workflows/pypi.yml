name: PyPI
run-name: PyPI ${{ github.ref_name }}

# Dispatch only builds/tests. Tag pushes can publish after opt-in.
# Configure the pypi environment and Trusted Publisher per docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/package-build.yml

  publish:
    name: Publish to PyPI
    if: >-
      github.repository == 'inmzhang/bloq' &&
      vars.RELEASE_PUBLISH_ENABLED == 'true' &&
      !contains(github.ref_name, '-') &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Publish distributions
        run: uv publish --trusted-publishing always dist/*
