name: Release-plz

# Release PRs are active. Publishing is opt-in; see docs/releasing.md.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Publish Rust crates
    if: github.repository == 'inmzhang/bloq' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a stable workspace version
        id: version
        run: |
          version=$(python3 tools/workspace_version.py current)
          if [[ "$version" == *-* ]]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install system dependencies
        if: steps.version.outputs.stable == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libasound2-dev libudev-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev \
            libxkbcommon-dev
      - name: Install pinned Rust toolchain
        if: steps.version.outputs.stable == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.stable == 'true'
      - uses: release-plz/action@v0.5
        if: steps.version.outputs.stable == 'true'
        with:
          command: release
        env:
          # A PAT is required here: its tags/releases trigger PyPI and binaries.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Supports first publication, unlike crates.io trusted publishing.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Prepare release PR
    if: github.repository == 'inmzhang/bloq'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Compare development changes against the last stable release
        run: |
          python3 tools/workspace_version.py release-baseline
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          config = Path('release-plz.toml').read_text()
          config = config.replace('[workspace]\n', '[workspace]\nallow_dirty = true\n', 1)
          Path(os.environ['RUNNER_TEMP'], 'release-plz.toml').write_text(config)
          PYTHON
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
          config: ${{ runner.temp }}/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: steps.release-pr.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Synchronize the documentation example lockfile in the release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/workspace_version.py lockfiles
          if ! git diff --quiet -- docs/examples/Cargo.lock; then
            git add docs/examples/Cargo.lock
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: synchronize release example lockfile'
            gh auth setup-git
            git push origin HEAD
          fi
