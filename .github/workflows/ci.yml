name: CI

# Always report the required CI status; job filters avoid irrelevant builds.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Bevy and the native test binaries otherwise overflow hosted-runner storage.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ steps.suites.outputs.checks }}
      site: ${{ steps.suites.outputs.site }}
      python: ${{ steps.filter.outputs.python }}
      packages: ${{ steps.suites.outputs.packages }}
      heavy: ${{ steps.suites.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow syntax
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run quick checks
        run: just ci-fast
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml
      - name: Select suites
        id: suites
        env:
          RUST_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
          SITE_CHANGED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.filter.outputs.site == 'true' || steps.filter.outputs.python == 'true' }}
          PACKAGES_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true' }}
        run: |
          suites=$(jq -cn --arg rust "$RUST_CHANGED" 'if $rust == "true" then ["ci-rust", "msrv"] else [] end')
          {
            echo "checks=$suites"
            echo "site=$SITE_CHANGED"
            echo "packages=$PACKAGES_CHANGED"
            if [ "$RUST_CHANGED" = true ] || [ "$SITE_CHANGED" = true ] || [ "$PACKAGES_CHANGED" = true ]; then
              echo "heavy=true"
            else
              echo "heavy=false"
            fi
          } >> "$GITHUB_OUTPUT"

  approve:
    name: Approve heavy PR checks
    needs: quick
    if: github.event_name == 'pull_request' && needs.quick.outputs.heavy == 'true'
    environment: heavy-pr-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Heavy checks approved for this PR run.'

  checks:
    name: ${{ matrix.recipe }}
    needs: [quick, approve]
    if: >-
      !cancelled() && needs.quick.result == 'success' &&
      (needs.approve.result == 'success' || (github.event_name != 'pull_request' && needs.approve.result == 'skipped')) &&
      needs.quick.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.quick.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7

      # Only linking the full native editor/test suite needs this extra space.
      - name: Free disk space
        if: matrix.recipe == 'ci-rust'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install native editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libasound2-dev libudev-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev \
            libxkbcommon-dev

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        env:
          CI_RECIPE: ${{ matrix.recipe }}
        run: |
          if [ "$CI_RECIPE" = msrv ]; then
            ci_toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
            rustup toolchain install "$ci_toolchain" --profile minimal
            echo "RUSTUP_TOOLCHAIN=$ci_toolchain" >> "$GITHUB_ENV"
          else
            rustup toolchain install
          fi

      - name: Install development tools
        uses: taiki-e/install-action@v2
        with:
          tool: just${{ matrix.recipe == 'ci-rust' && ',cargo-nextest' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bloq-${{ matrix.recipe }}-${{ runner.os }}-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run checks
        run: just ${{ matrix.recipe }}

  windows:
    name: Windows binaries
    needs: [quick, approve]
    if: >-
      !cancelled() && needs.quick.result == 'success' &&
      (needs.approve.result == 'success' || (github.event_name != 'pull_request' && needs.approve.result == 'skipped')) &&
      contains(needs.quick.outputs.checks, 'ci-rust')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bloq-windows-${{ runner.os }}-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Remap native build paths
        run: uv run --no-project python tools/release_build.py --github-env
      - name: Build CLI and editor
        run: cargo build --locked --release -p bloq-cli -p bloq_editor
      - name: Check CLI
        run: |
          target/release/bloq.exe --version
          target/release/bloq.exe compile --gallery cnot -d 3 --quiet -o target/cnot.stim

  site:
    name: Website and Python
    needs: [quick, approve]
    if: >-
      !cancelled() && needs.quick.result == 'success' &&
      (needs.approve.result == 'success' || (github.event_name != 'pull_request' && needs.approve.result == 'skipped')) &&
      needs.quick.outputs.site == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site-build.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      test-python: ${{ github.event_name == 'workflow_dispatch' || needs.quick.outputs.python == 'true' }}

  packages:
    name: Python packages
    needs: [quick, approve]
    if: >-
      !cancelled() && needs.quick.result == 'success' &&
      (needs.approve.result == 'success' || (github.event_name != 'pull_request' && needs.approve.result == 'skipped')) &&
      needs.quick.outputs.packages == 'true'
    uses: ./.github/workflows/package-build.yml

  ci:
    name: CI
    needs: [quick, approve, checks, windows, site, packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require all selected checks to pass
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/check_ci.py
