name: Build Bloq Website

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the assembled site to GitHub Pages and retain its snapshots'
        type: boolean
        default: false
      release_tag:
        description: 'Optional existing release tag to add as an immutable documentation snapshot'
        type: string
        default: ''
      make_stable:
        description: 'Make release_tag the stable documentation alias'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site-build.yml
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
      make_stable: ${{ inputs.make_stable || false }}
