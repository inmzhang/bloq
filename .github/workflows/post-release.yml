name: Start development after release

on:
  workflow_run:
    workflows: [Release-plz, PyPI, Binaries]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: post-release-development
  cancel-in-progress: false

jobs:
  development-pr:
    if: >-
      github.repository == 'inmzhang/bloq' && vars.RELEASE_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # workflow_run is privileged: execute only the trusted main checkout.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require all release uploads to have succeeded
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/post_release.py
      - name: Install pinned Rust toolchain
        if: steps.released.outputs.version != ''
        run: rustup toolchain install
      - name: Start the next development version
        if: steps.released.outputs.version != ''
        run: python3 tools/workspace_version.py dev
      - name: Open the development-bump PR
        if: steps.released.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PAT makes the new PR trigger the required CI workflow.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          base: main
          branch: chore/start-dev-after-${{ steps.released.outputs.version }}
          add-paths: |
            Cargo.toml
            Cargo.lock
            docs/examples/Cargo.lock
          commit-message: 'chore: start development after v${{ steps.released.outputs.version }}'
          title: 'chore: start development after v${{ steps.released.outputs.version }}'
          body: |
            Rust crates, Python packages, and all platform binaries for v${{ steps.released.outputs.version }} have been published successfully.

            Start the next development cycle by updating the shared Cargo version, exact internal requirements, and both Cargo lockfiles. Released tags and changelog entries are unchanged.

            This PR was generated by the post-release workflow. Approve its required CI checks and merge it to update main.
