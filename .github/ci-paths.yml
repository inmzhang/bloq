# Shared Cargo inputs affect every build. The action expands these YAML anchors.
# Keep fixture/assets rules: they include source inputs outside src/.
rust:
  - &cargo
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - '.cargo/**'
    - 'justfile'
    - '.github/workflows/{ci,site-build,package-build}.yml'
    - '.github/ci-paths.yml'
    - '**/Cargo.toml'
    - '**/build.rs'
  - 'clippy.toml'
  - 'bloq*/src/**'
  - 'bloq*/tests/**'
  - 'bloq*/benches/**'
  - 'bloq*/examples/**'
  - 'bloq*/assets/**'
  - 'bloq_editor/desktop/**'
  - 'THIRD-PARTY-NOTICES.txt'
  - 'tools/{release_build,test_release_build,check_ci}.py'
  - 'tools/{workspace_version,post_release}.py'
  - 'tools/third_party_licenses.{py,json}'
  - 'xtask/**'
  - 'docs/fixtures/**'
  # These Markdown files are embedded in Rust API documentation/doctests.
  - 'README.md'
  - 'docs/{guide,releasing}.md'
  - '!bloq_py/tests/**'

python:
  - *cargo
  - 'bloq*/src/**'
  - 'bloq_graph/assets/**'
  - 'bloq_py/**'
  - 'docs/**'
  - 'tools/*.py'
  - 'bloq_editor/desktop/*.py'
  - 'CONTRIBUTING.md'
  - '!bloq_editor/src/**'
  - '!bloq_editor/assets/**'
  - '!bloq_test/**'

site:
  - *cargo
  - 'bloq*/src/**'
  - 'bloq_graph/assets/**'
  - 'bloq_editor/**'
  - '!bloq_py/**'
  - '!bloq_vm/**'
  - '!bloq_cli/**'
  - '!bloq_test/**'
  - '!bloq/**'
  - 'docs/**'
  - 'tools/{site,test_site}.py'
  - '.github/workflows/website.yml'
  - 'CONTRIBUTING.md'

# Installed distributions exercise packaging and platforms beyond the dev build.
packages:
  - *cargo
  - 'LICENSE'
  - 'THIRD-PARTY-NOTICES.txt'
  - 'README.md'
  - 'bloq*/src/**'
  - 'bloq*/LICENSE'
  - 'bloq*/README.md'
  - 'bloq_graph/assets/**'
  - 'bloq_py/python/**'
  - 'bloq_py/pyproject.toml'
  - 'bloq_py/THIRD-PARTY-NOTICES.txt'
  - 'bloq_py/uv.lock'
  - 'tools/{release_build,check_installed_package}.py'
  - '.github/workflows/pypi.yml'
  - '!bloq_editor/**'
  - '!bloq_test/**'
